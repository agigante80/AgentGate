version: 2

updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      python-runtime:
        patterns:
          - "python-telegram-bot*"
          - "pydantic*"
          - "gitpython"
          - "openai"
          - "anthropic"
          - "ollama"
          - "requests"
      python-dev:
        dependency-type: development
        patterns:
          - "pytest*"
          - "ruff"
          - "coverage"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions

  # Docker base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
      - docker

  # npm globals (@github/copilot, @openai/codex, @google/gemini-cli,
  # @anthropic-ai/claude-code) — manifest in package.json, must stay in sync
  # with the Dockerfile (enforced by tests/unit/test_dockerfile_deps_sync.py)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      ai-cli:
        patterns:
          - "@github/copilot"
          - "@openai/codex"
          - "@google/gemini-cli"
          - "@anthropic-ai/claude-code"
    labels:
      - dependencies
      - npm
